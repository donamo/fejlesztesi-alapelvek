version: "3.9"

services:
  nginx:
    image: nginx:stable-alpine
    container_name: fejlesztesi_nginx
    volumes:
      - ./build:/usr/share/nginx/html:ro
      - ./default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --timeout=2 http://localhost:80 | grep -q '<html' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      - VIRTUAL_HOST=app.donamo.science
      - LETSENCRYPT_HOST=app.donamo.science
      - VIRTUAL_PORT=80

networks:
  default:
    external:
      name: nginx-proxy
