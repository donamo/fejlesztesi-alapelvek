version: "3.9"

services:
  nginx:
    build: .
    image: fejlesztesi-alapelvek-nginx
    container_name: fejlesztesi_nginx
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --timeout=2 http://localhost:80 | grep -q '<html' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      - VIRTUAL_HOST=app.donamo.science
      - LETSENCRYPT_HOST=app.donamo.science
      - VIRTUAL_PORT=80

networks:
  default:
    external:
      name: nginx-proxy
