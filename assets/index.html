<!doctype html>
<html lang="hu">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Enterprise fejlesztési alapok</title>
    <style>
      :root {
        --ink: #1b1b1b;
        --muted: #5b5b5b;
        --accent: #c65a2a;
        --accent-soft: #ffe2d6;
        --bg: #f6f2ea;
        --card: #fff9f4;
        --border: #e6d8c8;
        --shadow: 0 12px 30px rgba(27, 27, 27, 0.12);
        --radius-card: 18px;
        --radius-detail: 24px;
        --radius-button: 12px;
        --font-body: "Palatino Linotype", "Book Antiqua", Georgia, serif;
        --bg-main: #f6f2ea;
        --bg-grad-1: #fbe8d2;
        --bg-grad-2: #f2d7c6;
      }

      [data-theme="terra"] {
        --ink: #1b1b1b;
        --muted: #5b5b5b;
        --accent: #c65a2a;
        --accent-soft: #ffe2d6;
        --bg: #f6f2ea;
        --card: #fff9f4;
        --border: #e6d8c8;
        --shadow: 0 12px 30px rgba(27, 27, 27, 0.12);
        --radius-card: 18px;
        --radius-detail: 24px;
        --radius-button: 12px;
        --font-body: "Palatino Linotype", "Book Antiqua", Georgia, serif;
        --bg-main: #f6f2ea;
        --bg-grad-1: #fbe8d2;
        --bg-grad-2: #f2d7c6;
      }

      [data-theme="noir"] {
        --ink: #f5f3ee;
        --muted: #b2b7c1;
        --accent: #d9b26f;
        --accent-soft: #2b2a27;
        --bg: #0e1116;
        --card: #151a22;
        --border: #2b3442;
        --shadow: 0 18px 40px rgba(0, 0, 0, 0.5);
        --radius-card: 14px;
        --radius-detail: 18px;
        --radius-button: 10px;
        --font-body: "Avenir Next", "SF Pro Display", "Helvetica Neue", sans-serif;
        --bg-main: #0b0e13;
        --bg-grad-1: #111723;
        --bg-grad-2: #0a0f18;
      }

      [data-theme="aqua"] {
        --ink: #14252e;
        --muted: #4b6a78;
        --accent: #1b9aaa;
        --accent-soft: #dff4f6;
        --bg: #e9f7f9;
        --card: #f8fdfe;
        --border: #cfe6ea;
        --shadow: 0 12px 28px rgba(22, 76, 90, 0.16);
        --radius-card: 22px;
        --radius-detail: 28px;
        --radius-button: 14px;
        --font-body: "Gill Sans", "Trebuchet MS", sans-serif;
        --bg-main: #e9f7f9;
        --bg-grad-1: #cfeff2;
        --bg-grad-2: #d7f3f6;
      }

      [data-theme="orchard"] {
        --ink: #2a1f1b;
        --muted: #6b5b52;
        --accent: #c45d3b;
        --accent-soft: #f7e2d5;
        --bg: #fbf1e8;
        --card: #fff8f2;
        --border: #ead5c6;
        --shadow: 0 14px 32px rgba(67, 40, 30, 0.16);
        --radius-card: 12px;
        --radius-detail: 16px;
        --radius-button: 8px;
        --font-body: "Georgia", "Times New Roman", serif;
        --bg-main: #fbf1e8;
        --bg-grad-1: #f7e2d5;
        --bg-grad-2: #f0d8c7;
      }


      [data-theme="slate"] {
        --ink: #14181f;
        --muted: #5b6672;
        --accent: #3454d1;
        --accent-soft: #e0e7ff;
        --bg: #eef2f7;
        --card: #f9fbff;
        --border: #cfd8e3;
        --shadow: 0 10px 24px rgba(20, 24, 31, 0.12);
        --radius-card: 16px;
        --radius-detail: 20px;
        --radius-button: 10px;
        --font-body: "Arial Narrow", "Segoe UI", sans-serif;
        --bg-main: #eef2f7;
        --bg-grad-1: #dde5f1;
        --bg-grad-2: #e7eef8;
      }

      [data-theme="mono"] {
        --ink: #111111;
        --muted: #666666;
        --accent: #000000;
        --accent-soft: #f0f0f0;
        --bg: #fafafa;
        --card: #ffffff;
        --border: #d8d8d8;
        --shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        --radius-card: 0px;
        --radius-detail: 0px;
        --radius-button: 0px;
        --font-body: "Arial", "Helvetica", sans-serif;
        --bg-main: #fafafa;
        --bg-grad-1: #ededed;
        --bg-grad-2: #f7f7f7;
      }

      [data-theme="violet"] {
        --ink: #24162f;
        --muted: #6c5b77;
        --accent: #6b3fa0;
        --accent-soft: #efe4fb;
        --bg: #f6eefc;
        --card: #fff9ff;
        --border: #e4d3f4;
        --shadow: 0 14px 30px rgba(52, 20, 86, 0.16);
        --radius-card: 20px;
        --radius-detail: 26px;
        --radius-button: 12px;
        --font-body: "Trebuchet MS", "Verdana", sans-serif;
        --bg-main: #f6eefc;
        --bg-grad-1: #e8d6fa;
        --bg-grad-2: #f0e2ff;
      }


      [data-theme="forty"] {
        --ink: #0d1b2a;
        --muted: #4a5b70;
        --accent: #1b6ca8;
        --accent-soft: #e1f0ff;
        --bg: #f3f7fb;
        --card: #ffffff;
        --border: #d6e2f0;
        --shadow: 0 18px 36px rgba(13, 27, 42, 0.18);
        --radius-card: 8px;
        --radius-detail: 10px;
        --radius-button: 6px;
        --font-body: "Arial", "Helvetica Neue", sans-serif;
        --bg-main: #f3f7fb;
        --bg-grad-1: #dbe8f5;
        --bg-grad-2: #e6f0f8;
      }

      [data-theme="character"] {
        --ink: #1f1f2d;
        --muted: #6a6a7e;
        --accent: #ff7d3b;
        --accent-soft: #ffe7dc;
        --bg: #fff5ef;
        --card: #ffffff;
        --border: #f2d7c9;
        --shadow: 0 14px 30px rgba(255, 125, 59, 0.18);
        --radius-card: 26px;
        --radius-detail: 30px;
        --radius-button: 16px;
        --font-body: "Trebuchet MS", "Verdana", sans-serif;
        --bg-main: #fff5ef;
        --bg-grad-1: #ffe2d4;
        --bg-grad-2: #ffd8c2;
      }

      [data-theme="cafe"] {
        --ink: #2b1f17;
        --muted: #6e5a4a;
        --accent: #c07a4b;
        --accent-soft: #f2e2d3;
        --bg: #f8f1e8;
        --card: #fffaf4;
        --border: #e4d1bf;
        --shadow: 0 12px 28px rgba(67, 44, 31, 0.18);
        --radius-card: 14px;
        --radius-detail: 18px;
        --radius-button: 10px;
        --font-body: "Georgia", "Times New Roman", serif;
        --bg-main: #f8f1e8;
        --bg-grad-1: #f1dfcf;
        --bg-grad-2: #f5e6d7;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: var(--font-body);
        color: var(--ink);
        background: radial-gradient(1200px 500px at 10% 10%, var(--bg-grad-1) 0%, transparent 60%),
          radial-gradient(900px 600px at 90% 20%, var(--bg-grad-2) 0%, transparent 55%),
          var(--bg-main);
        min-height: 100vh;
      }

      header {
        padding: 48px 24px 24px;
        text-align: center;
      }

      header h1 {
        margin: 0 0 8px;
        font-size: clamp(2rem, 3vw + 1.5rem, 3.2rem);
        letter-spacing: 0.02em;
      }

      .title-row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 18px;
        flex-wrap: wrap;
      }

      .theme-picker {
        display: grid;
        gap: 6px;
        font-size: 0.8rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .theme-picker select {
        padding: 6px 10px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--ink);
        font-size: 0.9rem;
      }

      header p {
        margin: 0 auto;
        max-width: 720px;
        color: var(--muted);
        font-size: 1.05rem;
      }

      main {
        display: grid;
        grid-template-columns: minmax(200px, 0.9fr) minmax(360px, 2.4fr);
        gap: 28px;
        padding: 24px 16px;
        max-width: 1320px;
        margin: 0 auto 48px;
        align-items: stretch;
      }

      .list {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius-card);
        padding: 18px;
        box-shadow: var(--shadow);
        max-height: calc(100vh - 160px);
        overflow: auto;
      }

      .list h2 {
        margin: 0 0 12px;
        font-size: 1.2rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
      }

      .list ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 6px;
      }

      .list button {
        width: 100%;
        text-align: left;
        padding: 8px 12px;
        border-radius: var(--radius-button);
        border: 1px solid transparent;
        background: transparent;
        font-size: 0.9rem;
        color: var(--ink);
        cursor: pointer;
        transition: 0.2s ease;
        line-height: 1.25;
      }

      .list .menu-index {
        color: var(--muted);
        font-weight: 600;
        display: inline-block;
        margin-right: 6px;
      }

      .list button span {
        display: block;
        color: var(--muted);
        font-size: 0.8rem;
      }

      .list button:hover {
        border-color: var(--border);
        background: var(--card);
      }

      .list button.active {
        border-color: var(--accent);
        background: var(--accent-soft);
      }

      .category-label {
        margin-top: 12px;
        font-size: 0.75rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .detail {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius-detail);
        padding: 28px;
        box-shadow: var(--shadow);
        position: relative;
        overflow: hidden;
        max-height: calc(100vh - 160px);
        overflow: auto;
        overflow-x: hidden;
      }

      .detail::after {
        content: "";
        position: absolute;
        inset: auto -20% -20% auto;
        width: 220px;
        height: 220px;
        background: radial-gradient(circle, color-mix(in srgb, var(--accent) 30%, transparent), transparent 70%);
        border-radius: 50%;
      }

      .detail h3 {
        margin: 0 0 8px;
        font-size: clamp(1.4rem, 2.2vw + 1rem, 2rem);
      }

      .detail h4 {
        margin: 0 0 18px;
        font-weight: 400;
        color: var(--muted);
      }

      .detail p {
        margin: 0;
        line-height: 1.6;
        word-break: break-word;
      }

      footer {
        text-align: center;
        color: var(--muted);
        font-size: 0.9rem;
        padding-bottom: 32px;
      }

      @media (max-width: 900px) {
        main {
          grid-template-columns: 1fr;
        }
        .list,
        .detail {
          max-height: none;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="title-row">
        <h1>Enterprise fejlesztési alapok</h1>
        <label class="theme-picker">
          <span>Stílus</span>
          <select id="theme-select">
            <option value="terra">Terra (alapértelmezett)</option>
            <option value="noir">Noir</option>
            <option value="aqua">Aqua</option>
            <option value="orchard">Orchard</option>
            <option value="slate">Slate</option>
            <option value="mono">Mono (szogletes)</option>
            <option value="violet">Violet</option>
            <option value="forty">Forty-ish</option>
            <option value="character">Character-ish</option>
            <option value="cafe">Cafe House-ish</option>
          </select>
        </label>
      </div>
      <p>
        A 12factor.net alapelvek angol–magyar címmel, majd a kiegészítő, vállalati
        szinten is elvárt gyakorlatokkal.
      </p>
    </header>

    <main>
      <section class="list" aria-label="Lista">
        <h2>Lista</h2>
        <ul id="item-list"></ul>
      </section>

      <section class="detail" aria-live="polite">
        <h3 id="detail-en"></h3>
        <h4 id="detail-hu"></h4>
        <div id="detail-desc"></div>
      </section>
    </main>

    <footer>Forras: 12factor.net + enterprise gyakorlatok</footer>

    <script src="data.js"></script>
    <script>
      const listEl = document.getElementById("item-list");
      const detailEn = document.getElementById("detail-en");
      const detailHu = document.getElementById("detail-hu");
      const detailDesc = document.getElementById("detail-desc");
      const themeSelect = document.getElementById("theme-select");
      const root = document.documentElement;

      const getCookie = (name) => {
        const match = document.cookie.match(new RegExp(`(?:^|; )${name}=([^;]*)`));
        return match ? decodeURIComponent(match[1]) : "";
      };

      const setCookie = (name, value, days = 365) => {
        const date = new Date();
        date.setTime(date.getTime() + days * 24 * 60 * 60 * 1000);
        document.cookie = `${name}=${encodeURIComponent(value)}; expires=${date.toUTCString()}; path=/`;
      };

      const storedTheme = getCookie("fa-theme") || "terra";
      root.setAttribute("data-theme", storedTheme);
      if (themeSelect) {
        themeSelect.value = storedTheme;
        themeSelect.addEventListener("change", () => {
          const next = themeSelect.value;
          root.setAttribute("data-theme", next);
          setCookie("fa-theme", next);
        });
      }

      function selectItem(index) {
        const item = items[index];
        detailEn.textContent = item.en;
        detailHu.textContent = item.hu;
        detailDesc.innerHTML = item.descHtml || "";

        [...listEl.querySelectorAll("button")].forEach((button) => {
          const itemIndex = Number(button.dataset.index);
          button.classList.toggle("active", itemIndex === index);
        });
      }

      const groups = [];
      const seen = new Map();
      items.forEach((item, index) => {
        const category = item.category || "Egyeb";
        if (!seen.has(category)) {
          seen.set(category, groups.length);
          groups.push({ category, items: [] });
        }
        groups[seen.get(category)].items.push({ item, index });
      });

      let counter = 1;
      groups.forEach((group) => {
        const label = document.createElement("li");
        label.className = "category-label";
        label.textContent = group.category;
        listEl.appendChild(label);

        group.items.forEach(({ item, index }) => {
          const li = document.createElement("li");
          const button = document.createElement("button");
          button.type = "button";
          const indexLabel = String(counter++).padStart(2, "0");
          button.dataset.index = String(index);
          button.innerHTML = `<span class="menu-index">${indexLabel}.</span> ${item.en} <span>${item.hu}</span>`;
          button.addEventListener("click", () => selectItem(index));
          li.appendChild(button);
          listEl.appendChild(li);
        });
      });

      selectItem(0);
    </script>
  </body>
</html>
